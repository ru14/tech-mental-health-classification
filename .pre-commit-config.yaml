repos:
  # -------------------------------------------------------------------------
  # Strip notebook outputs before every commit.
  # Prevents large diffs and accidental PII/data leaks from cell outputs.
  # -------------------------------------------------------------------------
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: \.ipynb$

  # -------------------------------------------------------------------------
  # General file hygiene
  # -------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]          # block files > 5 MB
      - id: detect-private-key          # catch accidentally staged private keys
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # -------------------------------------------------------------------------
  # Secret detection — scans staged content for credential patterns
  # -------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: \.ipynb$              # notebook JSON often triggers false positives

  # -------------------------------------------------------------------------
  # Python code formatting
  # -------------------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3.11
        types_or: [python, pyi]

  # -------------------------------------------------------------------------
  # Import sorting
  # -------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
