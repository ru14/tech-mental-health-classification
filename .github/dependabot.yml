version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    groups:
      ml-stack:
        patterns:
          - "scikit-learn"
          - "numpy"
          - "pandas"
          - "shap"
      viz-stack:
        patterns:
          - "matplotlib"
          - "seaborn"
      jupyter-stack:
        patterns:
          - "jupyter"
          - "notebook"
          - "nbformat"
          - "nbconvert"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
