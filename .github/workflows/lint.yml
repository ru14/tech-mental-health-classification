name: Lint & Format

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions: read-all

jobs:
  lint:
    name: Notebook & code quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify notebook outputs are stripped
        run: |
          nbstripout --verify notebooks/mental_health_analysis.ipynb
          echo "✅ Notebook has no committed outputs."

      - name: Check Black formatting (Python scripts)
        run: |
          # Only run Black if there are .py files to check
          if find . -name "*.py" -not -path "./.venv/*" | grep -q .; then
            black --check --diff .
          else
            echo "No .py files found — skipping Black."
          fi

      - name: Validate requirements files are well-formed
        run: |
          pip check || true
          python -c "
          import re, sys
          loose = re.compile(r'[><!~]=|!=')
          strict = re.compile(r'^[A-Za-z0-9_\-]+==[0-9]')
          bad = []
          with open('requirements.txt') as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith('#'):
                      if not strict.match(line):
                          bad.append(line)
          if bad:
              print('Unpinned dependencies in requirements.txt:', bad)
              sys.exit(1)
          print('All production dependencies are pinned.')
          "
